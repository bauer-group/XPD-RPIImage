# =============================================================================
# BAUER GROUP XPD-RPIImage - Semantic Release Workflow
# =============================================================================
# Triggers:
#   - Push to main branch (excluding docs/markdown and workflow changes)
#   - Manual dispatch with force-release option
#
# Responsibility:
#   * bump `.variant.version` in config/variants/base.json
#   * write CHANGELOG.md
#   * create tag `vX.Y.Z` and a GitHub release with auto-generated notes
#
# Image artifacts (.img.xz + .sha256 + .manifest.json) are attached to the
# release by build.yml's `release` job. The tag here is pushed with
# GITHUB_TOKEN, which never triggers another workflow, so the `attach-images`
# job below dispatches build.yml on the tag using a PAT instead.
# (see docs/ci-cd.md -> "When it triggers" for the full rationale)
# =============================================================================

name: 🚀 Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      # Pages site + its renderer are cosmetic; never cut a release for them.
      - 'site/**'
      - 'scripts/build_pages.py'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ============================================
  # Release Job
  # ============================================

  release:
    name: 📦 Create Semantic Release
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
      extra-plugins: '@google/semantic-release-replace-plugin'
    secrets: inherit

  # ============================================
  # Attach image assets to the fresh release
  # ============================================
  # The tag above is pushed with GITHUB_TOKEN, and GitHub never triggers a
  # workflow from a GITHUB_TOKEN event - so build.yml's `tags: ["v*.*.*"]`
  # trigger does not fire and the release would stay empty. Every release
  # from v0.2.4 to v0.4.2 shipped without images for exactly this reason.
  #
  # A workflow_dispatch made with a PAT is attributed to that token's user,
  # not to GITHUB_TOKEN, so it starts a real run. The shared semantic-release
  # template hardcodes GITHUB_TOKEN and accepts no token input, which is why
  # the PAT is applied here rather than passed into it.
  attach-images:
    name: 🖼️ Dispatch image build for the tag
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 🚀 Trigger build on the release tag
        env:
          GH_TOKEN: ${{ secrets.PAT_READWRITE_ORGANISATION }}
          TAG: ${{ needs.release.outputs.tag-name }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
              echo "::error::PAT_READWRITE_ORGANISATION is empty - the release" \
                   "will have no image assets. Attach them by hand:" \
                   "gh workflow run build.yml --ref ${TAG}"
              exit 1
          fi
          echo "dispatching build.yml on ${TAG}"
          gh workflow run build.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"
          echo "### 🖼️ Image build dispatched on \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
